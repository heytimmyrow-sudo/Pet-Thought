<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8c84e">
  <meta name="description" content="Upload a cat or dog photo and add a silly little pet thought or speech bubble.">
  <title>Pet Thought Bubbler</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="studio" aria-labelledby="appTitle">
      <div class="workspace">
        <div class="brand-row">
          <div>
            <p class="eyebrow">Pet Thought Bubbler</p>
            <h1 id="appTitle">What is this tiny roommate thinking?</h1>
          </div>
          <button class="icon-button" id="shuffleAllBtn" type="button" aria-label="Surprise me" title="Surprise me">?</button>
        </div>

        <div class="canvas-wrap">
          <canvas id="petCanvas" width="1200" height="900" aria-label="Pet photo with caption bubble"></canvas>
          <div class="empty-state" id="emptyState">
            <div class="empty-mark" aria-hidden="true">
              <span></span>
              <i></i>
            </div>
            <p>Drop in a cat or dog photo.</p>
          </div>
        </div>
      </div>

      <aside class="controls" aria-label="Pet bubble controls">
        <label class="upload-zone" id="dropZone">
          <input id="photoInput" type="file" accept="image/*">
          <span>Choose Photo</span>
          <small>JPG, PNG, GIF, or a fresh camera shot</small>
        </label>

        <div class="control-block">
          <span class="label">Pet</span>
          <div class="segmented" role="group" aria-label="Pet type">
            <button class="active" data-pet="cat" type="button">Cat</button>
            <button data-pet="dog" type="button">Dog</button>
            <button data-pet="either" type="button">Mystery</button>
          </div>
        </div>

        <div class="control-block">
          <span class="label">Bubble</span>
          <div class="segmented" role="group" aria-label="Bubble type">
            <button class="active" data-bubble="thought" type="button">Think</button>
            <button data-bubble="speech" type="button">Say</button>
          </div>
        </div>

        <div class="control-block">
          <span class="label">Mood</span>
          <select id="moodSelect" aria-label="Phrase mood">
            <option value="random">All the silliness</option>
            <option value="food">Food crimes</option>
            <option value="royalty">Tiny royalty</option>
            <option value="chaos">Gentle chaos</option>
            <option value="nap">Nap science</option>
            <option value="dramatic">Very dramatic</option>
            <option value="compliment">Sweet little compliments</option>
          </select>
        </div>

        <div class="control-block">
          <span class="label">Phrase</span>
          <textarea id="phraseInput" rows="3" maxlength="110" aria-label="Pet phrase"></textarea>
          <div class="button-grid">
            <button class="btn primary" id="phraseBtn" type="button">New Phrase</button>
            <button class="btn" id="shortBtn" type="button">Short</button>
          </div>
        </div>

        <div class="control-block">
          <span class="label">Bubble Spot</span>
          <div class="position-grid" role="group" aria-label="Bubble position">
            <button data-position="top-left" type="button" aria-label="Top left"></button>
            <button class="active" data-position="top-right" type="button" aria-label="Top right"></button>
            <button data-position="bottom-left" type="button" aria-label="Bottom left"></button>
            <button data-position="bottom-right" type="button" aria-label="Bottom right"></button>
          </div>
        </div>

        <div class="control-block sliders">
          <label>
            <span>Bubble Size</span>
            <input id="sizeRange" type="range" min="72" max="132" value="100">
          </label>
          <label>
            <span>Text Size</span>
            <input id="textRange" type="range" min="70" max="125" value="100">
          </label>
        </div>

        <div class="actions">
          <button class="btn primary" id="downloadBtn" type="button">Download Image</button>
          <button class="btn" id="clearBtn" type="button">Clear Photo</button>
        </div>
      </aside>
    </section>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
