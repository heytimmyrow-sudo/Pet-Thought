<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8c84e">
  <meta name="description" content="Upload a cat or dog photo and add a silly little pet thought or speech bubble.">
  <meta property="og:title" content="Pet Thought Bubbler">
  <meta property="og:description" content="Upload a pet photo and add a silly thought bubble.">
  <meta property="og:image" content="/app-photo.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pet Thought Bubbler">
  <meta name="twitter:description" content="Upload a pet photo and add a silly thought bubble.">
  <meta name="twitter:image" content="/app-photo.png">
  <title>Pet Thought Bubbler</title>
  <link rel="icon" type="image/png" href="app-photo.png">
  <link rel="apple-touch-icon" href="app-photo.png">
  <link rel="stylesheet" href="styles.css?v=24">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js" defer></script>
</head>
<body>
  <main class="app">
    <section class="studio" aria-labelledby="appTitle">
      <div class="workspace">
        <div class="brand-row">
          <div>
            <p class="eyebrow">Pet Thought Bubbler</p>
            <h1 id="appTitle">What is this tiny roommate thinking?</h1>
          </div>
          <button class="icon-button" id="shuffleAllBtn" type="button" aria-label="Surprise me" title="Surprise me">?</button>
        </div>

        <div class="canvas-wrap">
          <canvas id="petCanvas" width="1200" height="900" aria-label="Pet photo with caption bubble"></canvas>
          <div class="empty-state" id="emptyState">
            <div class="empty-mark" aria-hidden="true">
              <span></span>
              <i></i>
            </div>
            <p>Drop in a cat or dog photo.</p>
            <label class="empty-camera" for="cameraInput">Take Photo</label>
          </div>
        </div>
        <div class="gallery hidden" id="gallery" aria-label="Recent creations">
          <div class="gallery-head">
            <span>Recent</span>
            <button class="link-button" id="clearGalleryBtn" type="button">Clear</button>
          </div>
          <div class="gallery-strip" id="galleryStrip"></div>
        </div>
      </div>

      <aside class="controls" aria-label="Pet bubble controls">
        <label class="upload-zone" id="dropZone">
          <input id="photoInput" type="file" accept="image/*">
          <span>Choose Photo</span>
          <small>JPG, PNG, GIF, or a fresh camera shot</small>
        </label>
        <input id="cameraInput" class="visually-hidden" type="file" accept="image/*" capture="environment">
        <label class="camera-button" id="cameraBtn" for="cameraInput" role="button" tabindex="0" aria-label="Open camera">
          <span aria-hidden="true"></span>
          Camera
        </label>
        <p class="detector-status" id="detectorStatus" aria-live="polite">Ready to spot cats and dogs.</p>

        <div class="control-block">
          <label class="label" for="petNameInput">Pet Name</label>
          <input id="petNameInput" class="text-input" type="text" maxlength="24" placeholder="Optional">
        </div>

        <div class="control-block">
          <span class="label">Pet</span>
          <div class="segmented" role="group" aria-label="Pet type">
            <button class="active" data-pet="cat" type="button">Cat</button>
            <button data-pet="dog" type="button">Dog</button>
            <button data-pet="either" type="button">Mystery</button>
          </div>
        </div>

        <div class="control-block">
          <span class="label">Bubble</span>
          <div class="segmented" role="group" aria-label="Bubble type">
            <button class="active" data-bubble="thought" type="button">Think</button>
            <button data-bubble="speech" type="button">Say</button>
          </div>
        </div>

        <div class="control-block">
          <span class="label">Style</span>
          <select id="styleSelect" aria-label="Bubble style">
            <option value="classic">Classic bubble</option>
            <option value="comic">Comic pop</option>
            <option value="cloud">Cloud thought</option>
            <option value="sticker">Sticker label</option>
            <option value="whisper">Tiny whisper</option>
            <option value="announcement">Big announcement</option>
            <option value="news">Breaking news</option>
          </select>
        </div>

        <div class="control-block">
          <span class="label">Phrase Pack</span>
          <select id="moodSelect" aria-label="Phrase mood">
            <option value="random">All the silliness</option>
            <option value="food">Food crimes</option>
            <option value="royalty">Tiny royalty</option>
            <option value="chaos">Gentle chaos</option>
            <option value="nap">Nap science</option>
            <option value="dramatic">Very dramatic</option>
            <option value="compliment">Sweet little compliments</option>
            <option value="birthday">Birthday pet</option>
            <option value="morning">Good morning</option>
            <option value="apology">Apology note</option>
            <option value="holiday">Holiday fluff</option>
            <option value="hungry">Hungry</option>
            <option value="sleepy">Sleepy</option>
            <option value="guilty">Guilty</option>
            <option value="excited">Excited</option>
            <option value="fancy">Fancy</option>
            <option value="confused">Confused</option>
            <option value="boss">Tiny Boss</option>
          </select>
        </div>

        <div class="control-block photo-only" id="phraseBlock">
          <span class="label">Phrase</span>
          <textarea id="phraseInput" rows="3" maxlength="110" aria-label="Pet phrase"></textarea>
          <div class="phrase-choices" id="phraseChoices" aria-label="Phrase choices"></div>
          <div class="button-grid">
            <button class="btn primary" id="phraseBtn" type="button">New Phrase</button>
            <button class="btn" id="shortBtn" type="button">Short</button>
          </div>
        </div>

        <div class="control-block">
          <span class="label">Bubble Spot</span>
          <div class="position-grid" role="group" aria-label="Bubble position">
            <button class="auto active" data-position="auto" type="button" aria-label="Auto align near pet head">Auto</button>
            <button class="manual" data-position="manual" type="button" aria-label="Manual bubble placement">Drag</button>
            <button data-position="top-left" type="button" aria-label="Top left"></button>
            <button data-position="top-right" type="button" aria-label="Top right"></button>
            <button data-position="bottom-left" type="button" aria-label="Bottom left"></button>
            <button data-position="bottom-right" type="button" aria-label="Bottom right"></button>
          </div>
        </div>

        <div class="control-block photo-only">
          <span class="label">Decorations</span>
          <div class="sticker-grid" role="group" aria-label="Add decoration">
            <button data-sticker="heart" type="button" aria-label="Add heart">♥</button>
            <button data-sticker="star" type="button" aria-label="Add star">★</button>
            <button data-sticker="paw" type="button" aria-label="Add paw">●</button>
            <button data-sticker="crown" type="button" aria-label="Add crown">♛</button>
            <button data-sticker="party" type="button" aria-label="Add party hat">▲</button>
            <button data-sticker="sparkle" type="button" aria-label="Add sparkle">✦</button>
          </div>
        </div>

        <div class="control-block photo-only">
          <span class="label">Doodle</span>
          <div class="doodle-tools">
            <button class="btn" id="doodleBtn" type="button">Draw</button>
            <input id="doodleColor" type="color" value="#f37b62" aria-label="Doodle color">
            <input id="doodleSize" type="range" min="3" max="28" value="9" aria-label="Doodle size">
            <button class="btn" id="undoDoodleBtn" type="button">Undo</button>
            <button class="btn" id="clearDoodleBtn" type="button">Clear</button>
          </div>
        </div>

        <div class="control-block sliders">
          <label>
            <span>Bubble Size</span>
            <input id="sizeRange" type="range" min="72" max="132" value="100">
          </label>
          <label>
            <span>Text Size</span>
            <input id="textRange" type="range" min="70" max="125" value="100">
          </label>
        </div>

        <div class="actions">
          <button class="btn primary" id="downloadBtn" type="button">Download Image</button>
          <button class="btn" id="clearBtn" type="button">Clear Photo</button>
          <button class="btn photo-only" id="beforeAfterBtn" type="button">Original</button>
          <button class="btn" id="copyLinkBtn" type="button">Copy Link</button>
          <button class="btn" id="qrBtn" type="button">QR Code</button>
          <button class="btn primary photo-only" id="sharePhotoBtn" type="button">Share Photo</button>
          <button class="btn" id="shareAppBtn" type="button">Share App</button>
        </div>
      </aside>
    </section>
  </main>
  <div class="qr-modal hidden" id="qrModal" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
    <div class="qr-card">
      <button class="qr-close" id="qrCloseBtn" type="button" aria-label="Close QR code">×</button>
      <h2 id="qrTitle">Scan to Open</h2>
      <div class="qr-code-box" id="qrCodeBox" aria-label="QR code for Pet Thought Bubbler"></div>
      <p id="qrUrlText">https://new-games-jcrow.timmyrow.chatgpt.site</p>
      <div class="qr-actions">
        <button class="btn primary" id="copyQrLinkBtn" type="button">Copy Link</button>
        <button class="btn" id="downloadQrBtn" type="button">Download QR</button>
      </div>
    </div>
  </div>
  <script src="qr-code.js?v=24"></script>
  <script type="module" src="game.js?v=24"></script>
</body>
</html>
