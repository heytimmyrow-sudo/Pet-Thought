<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101825">
  <title>Magnet Mayhem Delivery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="titleScreen" class="screen title-screen">
      <div class="title-art" aria-hidden="true">
        <span class="coil red"></span>
        <span class="bot-face">M</span>
        <span class="coil blue"></span>
      </div>
      <p class="eyebrow">Arcade-puzzle factory runs</p>
      <h1>Magnet Mayhem Delivery</h1>
      <p class="lede">Flip the room's polarity, herd a fragile metal package, and reach the delivery chute before the factory gets too spicy.</p>
      <div class="button-row">
        <button class="btn primary" id="playBtn" type="button">Play</button>
        <button class="btn" id="levelSelectBtn" type="button">Levels</button>
        <button class="btn" id="packsBtn" type="button">Expansion Packs</button>
        <button class="btn icon" id="fullscreenBtn" type="button" aria-label="Toggle fullscreen">[]</button>
      </div>
      <div class="button-row slim">
        <button class="link" id="settingsOpenBtn" type="button">Settings</button>
        <button class="link" id="exportBtn" type="button">Export Save</button>
        <label class="link file-label">Import Save<input id="importInput" type="file" accept="application/json"></label>
      </div>
    </section>

    <section id="menuScreen" class="screen menu-screen hidden">
      <div class="menu-head">
        <button class="btn icon" data-screen="titleScreen" type="button" aria-label="Back">&lt;</button>
        <div>
          <p class="eyebrow">Base Game</p>
          <h2>Level Select</h2>
        </div>
      </div>
      <div id="levelGrid" class="level-grid"></div>
    </section>

    <section id="packsScreen" class="screen menu-screen hidden">
      <div class="menu-head">
        <button class="btn icon" data-screen="titleScreen" type="button" aria-label="Back">&lt;</button>
        <div>
          <p class="eyebrow">Update-safe content</p>
          <h2>Expansion Packs</h2>
        </div>
      </div>
      <div id="packGrid" class="pack-grid"></div>
    </section>

    <section id="gameScreen" class="game-screen hidden">
      <header class="hud">
        <div><b id="hudLevel">Level 1</b><span id="hudPack">Base Game</span></div>
        <div class="meter"><span>Time</span><b id="timer">0.0</b></div>
        <div class="durability" aria-label="Package durability"><i></i><i></i><i></i></div>
        <div class="polarity" id="polarityBadge">NORTH</div>
        <button class="hud-btn" id="restartBtn" type="button">R</button>
        <button class="hud-btn" id="pauseBtn" type="button">II</button>
      </header>
      <canvas id="gameCanvas" width="960" height="540" aria-label="Magnet Mayhem Delivery game canvas"></canvas>
      <nav class="touch-controls" aria-label="Mobile controls">
        <button data-touch="left" type="button">&lt;</button>
        <button data-touch="right" type="button">&gt;</button>
        <button data-touch="jump" type="button">^</button>
        <button data-touch="pickup" type="button">E</button>
        <button data-touch="flip" type="button">F</button>
        <button data-touch="restart" type="button">R</button>
      </nav>
    </section>

    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
      <div class="modal">
        <h2 id="overlayTitle">Paused</h2>
        <p id="overlayText"></p>
        <div id="stampResult" class="stamp-result"></div>
        <div id="overlayActions" class="button-row"></div>
      </div>
    </div>

    <div id="settingsPanel" class="overlay hidden" role="dialog" aria-modal="true">
      <div class="modal">
        <h2>Settings</h2>
        <label class="toggle"><input id="soundToggle" type="checkbox"> Sound effects</label>
        <label class="toggle"><input id="musicToggle" type="checkbox"> Music pulse</label>
        <label class="toggle"><input id="shakeToggle" type="checkbox"> Screen shake</label>
        <div class="button-row">
          <button class="btn primary" id="settingsSaveBtn" type="button">Done</button>
          <button class="btn danger" id="resetBtn" type="button">Reset Progress</button>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
